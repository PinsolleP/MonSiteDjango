{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mon site Django{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'polls/style.css' %}">
    {% block css %}{% endblock %}
</head>
<body>

    <header>
        {% if user.is_authenticated %}
            <p>Bonjour {{user.username}}</p>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Se déconnecter</button>
            </form>

        {% else %}
            <a href="{% url 'login' %}?next={% url 'polls:index' %}">Connexion</a>
        {% endif %}

        {% block header %}
        {% endblock %}
    </header>

    <main>
        {% block main %}
        {% endblock %}
    </main>

</body>
</html>
