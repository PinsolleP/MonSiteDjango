{% extends 'base.html' %}

{% block title %}
Ajouter un sondage
{% endblock %}

{% block main %}

<h1>Ajouter un sondage</h1>

<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit">Créer le sondage</button>
</form>
<p>
    <a href="{% url 'polls:index' %}">Retour à l'accueil</a>
</p>
{% endblock %}
