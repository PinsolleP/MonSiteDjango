{% extends 'base.html' %}

{% block title %}
<h1>Liste de tous les sondages</h1>
{% endblock %}

{% block main %}
<ul>
{% for question in question_list %}
    <li>{{ question.id }} --
        <a href="{% url 'polls:frequency' question.id %}">
            {{ question.question_text }}
        </a>
    </li>
{% endfor %}
</ul>
{% endblock %}
